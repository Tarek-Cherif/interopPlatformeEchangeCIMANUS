spring.application.name=interopPlatformeEchangeCI
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${ORACLE_DB_URL:jdbc:oracle:thin:@192.168.3.13:1521:dbcnr}
spring.datasource.username=${ORACLE_DB_USERNAME:affnouv}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
# Auto-commit JDBC: ne couvre pas SCP; valider les COMMIT/ROLLBACK de la procédure avec le DBA.
spring.datasource.hikari.auto-commit=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.open-in-view=false
scp.host=${SCP_HOST}
scp.port=${SCP_PORT:22}
scp.username=${SCP_USERNAME:oracle}
scp.password=${SCP_PASSWORD}
scp.remote-directory=${SCP_REMOTE_DIRECTORY:/oracle/traitement}
scp.timeout=${SCP_TIMEOUT:30000}
scp.known-hosts=${SCP_KNOWN_HOSTS}
spring.servlet.multipart.max-file-size=${EPIC_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${EPIC_MAX_REQUEST_SIZE:21MB}
epic.operation-date-format=${EPIC_OPERATION_DATE_FORMAT:dd/MM/yyyy HH:mm:ss}
epic.time-zone=${EPIC_TIME_ZONE:Africa/Tunis}
epic.oracle-query-timeout-seconds=${EPIC_ORACLE_TIMEOUT_SECONDS:300}
springdoc.swagger-ui.path=/swagger-ui.html
logging.level.com.cnrps.InteropPlatformeEchangeCI=INFO
logging.pattern.level=%5p [correlationId=%X{correlationId}]
